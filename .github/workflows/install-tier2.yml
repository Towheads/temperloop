name: Install Tier-2 (install + adopt-path round trip)

# install-tier2.yml — the tier-2 leg of ADR K164 D6's install-lifecycle
# validation strategy (temperloop#268). Tier-1
# (workflows/scripts/tests/test_install_lifecycle.sh, wired into
# scripts/quality-gates.sh's `checks` job — see docs/features/
# ci-install-lifecycle.md) proves the install/uninstall MACHINE-SURFACE
# lifecycle hermetically, entirely inside a sandboxed HOME/XDG tree with a
# `file://` bare clone as its only "network" call — fast and free enough to
# run on every PR. This workflow proves the OTHER half this tier-1 gate
# cannot: that a real newcomer's INSTALL (`bin/bootstrap.sh`, exercising the
# just-checked-out ref) and ADOPT PATH (`temperloop init` -> `temperloop
# eject`) still work against a REAL target repo over REAL network with a
# REAL `gh` — see docs/features/ci-install-tier2.md for the full "how it
# works".
#
# RE-SCOPED off the retired `try` path (temperloop#1234, epic #1117). This
# workflow used to also drive `temperloop try` (a live `claude -p`
# shadow-triage call) and `temperloop testbed` (create/destroy a disposable
# evaluation repo). Neither runs here any more:
#   - `try` is no longer part of the adoption path (temperloop#1115) — the
#     step, its ANTHROPIC_API_KEY secret, and the Claude Code CLI install it
#     needed are all removed outright, not merely skipped.
#   - `testbed` is NOT run here (deliberately — see "SCOPE GAP" below). This
#     workflow's round trip is `init` -> `eject` only, against the ONE
#     persistent, this-project-scoped repo named below — never a
#     just-created disposable one.
#
# THE CREDENTIAL: `DEMO_REPO_TOKEN` is a fine-grained PAT scoped to exactly
# one repository — resource owner `Towheads`, repository access limited to
# `temperloop-demo`, permissions Contents + Issues + Administration. It
# cannot reach `Towheads/temperloop` or any other repository, and — because
# repository CREATION needs an org-wide grant no single-repo-scoped token
# can carry — it cannot create a repository either. This workflow therefore
# never creates or deletes a repository at any point; both are structurally
# unreachable from this credential, not merely avoided by convention. This
# is also why the target is a PERSISTENT, pre-existing repo
# (`Towheads/temperloop-demo`) rather than a fresh one per run: a fixed,
# known repo name is what lets the token be scoped this narrowly in the
# first place — see `Decisions/temperloop - CI round trip keeps a
# persistent demo repo, not per-run create-delete` and ADR 0025's amended
# "CI inherits the rule" consequence.
#
# REUSABLE BASELINE, EACH RUN. `temperloop eject` is the primary reversal
# leg: it reverts exactly the install-manifest-tracked API state `init`
# applied (a proposal branch + PR onto a single, reused branch name) and
# leaves nothing else behind — see eject.sh's own header for the manifest
# model. The one other thing `init` COULD create is the first-epic issue its
# Step 2 offers to file (`--yes-first-epic`) or, on an explicit decline, a
# durable re-offer-pointer issue (`--no-first-epic`) — either would need its
# own explicit close/clean step to keep the repo baseline-stable. This
# workflow instead chooses the OTHER option point (d) of temperloop#1234
# names: it passes NEITHER `--yes-first-epic` NOR `--no-first-epic`, so
# `init`'s own ambient-CI detection (`GITHUB_ACTIONS` is set) makes it
# legibly SKIP the offer ("first-epic: skipped — no interactive operator
# detected …") rather than deciding it. Nothing is ever filed, so there is
# nothing here to clean up — simpler and more robust than a create-then-
# close mechanism, at the cost of never exercising the first-epic offer
# itself (that offer already has its own coverage: init.sh's unit suite,
# test_init.sh, drives both the accept and decline paths hermetically).
#
# SCOPE GAP (accepted, see ADR 0025 "CI inherits the rule" as amended by
# this same change): because this workflow never creates or tears down a
# repository, `temperloop testbed` and its teardown leg have NO weekly
# automated coverage here. They are exercised only by their own unit tests
# (a faked `gh`) and by temperloop#1240's one-time executed run. This is a
# deliberate, named trade-off, not an oversight — see the ADR for the full
# reasoning.
#
# WHY NEVER PER-PR (the reason this is a SEPARATE workflow, not a job added
# to ci.yml's `checks`):
#   - SHARED REMOTE STATE: `temperloop init` writes a real remote proposal
#     branch + PR onto the shared demo repo. Two PRs' tier-2 runs racing the
#     same remote repo concurrently would collide; this workflow's own
#     `concurrency` group below serializes runs for exactly that reason,
#     which is fine for a weekly/manual cadence and wrong for a per-PR one.
#   - FLAKINESS SURFACE: real network + GitHub API rate limits are exactly
#     the nondeterminism per-PR CI must not carry (a stranger's PR should
#     never go red because the demo repo's API round-trip hiccuped) —
#     that's what tier-1's hermetic suite is FOR.
#
# CADENCE: weekly (Monday 05:00 UTC) is right for a release-gate leg — it
# only needs to prove the live path still works before a release ships, not
# on every commit. Also `workflow_dispatch` for an on-demand run — in
# particular, run this BY HAND once before cutting a kernel release tag
# (its "release-gate role": a green run here is the real-world proof tier-1
# can't give, that a stranger's actual `init`/`eject` still works against a
# live target repo, not just a hermetic sandbox).
#
# VERIFICATION NOTE: this item's own PR cannot demonstrate a green run of
# this workflow — it never triggers on `pull_request` by design (see below),
# so a run only happens on the next Monday schedule or an operator's manual
# `workflow_dispatch` after merge, with `DEMO_REPO_TOKEN` in place.
#
# FAILURE VISIBILITY: `on: schedule` failures already trigger GitHub's
# built-in scheduled-workflow-failure notification (repo Watch settings ->
# Actions) to the repo's default recipients — no extra notification
# plumbing needed here. On top of that, the final "Round-trip verdict" job
# step below writes a leg-by-leg outcome table to $GITHUB_STEP_SUMMARY and
# fails the job with an explicit `::error::` line NAMING which leg
# (init/eject) failed — see that step for why a bare exit-code check on
# `init` isn't enough (it is deliberately fail-open at the shell-exit-code
# layer; a real failure is caught by content-scanning its captured log for
# a `FAILED` marker instead).
#
# NEVER pull_request / push / merge_group — this workflow must never gate
# or run on a PR. If you're tempted to add one of those triggers here,
# that's tier-1's job (scripts/quality-gates.sh via ci.yml), not this
# file's.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# One real round trip against the shared demo repo at a time — a second
# concurrent run would race the same remote API state (see "WHY NEVER
# PER-PR" above). Let an in-flight run finish rather than cancel it
# mid-mutation.
concurrency:
  group: install-tier2
  cancel-in-progress: false

env:
  DEMO_REPO: Towheads/temperloop-demo  # denylist:allow — this repo's own persistent demo-repo identity (temperloop#1234), not a personal-token leak

jobs:
  round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify DEMO_REPO_TOKEN is present and functional
        env:
          GH_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::install-tier2: missing required repo secret DEMO_REPO_TOKEN — set it under Settings > Secrets and variables > Actions (a fine-grained PAT scoped to $DEMO_REPO only: Contents + Issues + Administration), then re-run. See docs/features/ci-install-tier2.md."
            exit 1
          fi
          if ! gh api "repos/$DEMO_REPO" --jq .full_name >/dev/null 2>&1; then
            echo "::error::install-tier2: DEMO_REPO_TOKEN is set but cannot read $DEMO_REPO — check the token is unexpired, unrevoked, and still scoped to this repo. See docs/features/ci-install-tier2.md."
            exit 1
          fi
          echo "install-tier2: DEMO_REPO_TOKEN present and functional against $DEMO_REPO"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bootstrap the temperloop CLI from this checkout
        run: |
          TEMPERLOOP_HOME="$RUNNER_TEMP/temperloop-home"
          TEMPERLOOP_BIN_DIR="$RUNNER_TEMP/temperloop-bin"
          TEMPERLOOP_KERNEL_REPO="file://$GITHUB_WORKSPACE" \
            TEMPERLOOP_HOME="$TEMPERLOOP_HOME" \
            TEMPERLOOP_BIN_DIR="$TEMPERLOOP_BIN_DIR" \
            sh bin/bootstrap.sh
          echo "$TEMPERLOOP_BIN_DIR" >> "$GITHUB_PATH"
          echo "TEMPERLOOP_HOME=$TEMPERLOOP_HOME" >> "$GITHUB_ENV"

      # The release must be VERSIONED: the just-installed CLI has to report the
      # version embedded in its shipped files (temperloop#677), not "dev". This
      # is the one leg that proves the install carries its own version number —
      # a hermetic unit gate (test_version_embedding.sh) can't, because it only
      # sees the in-tree checkout, not what bootstrap actually landed on PATH.
      # Fail-closed: unlike init there is no degraded-network excuse for a
      # wrong version string. continue-on-error so the round trip below still
      # runs and the verdict reports every leg at once.
      - name: "Version embedded in the install"
        id: version
        continue-on-error: true
        run: |
          set -euo pipefail
          shipped="$(sed -e 's/[[:space:]]//g' -e '/^$/d' "$TEMPERLOOP_HOME/VERSION" | head -n1)"
          [ -n "$shipped" ] || { echo "::error::install-tier2: pinned checkout $TEMPERLOOP_HOME has no readable VERSION file"; exit 1; }
          reported="$(temperloop version)"
          echo "shipped VERSION file: $shipped"
          echo "temperloop version : $reported"
          if [ "$reported" = "temperloop dev" ]; then
            echo "::error::install-tier2: 'temperloop version' reports 'dev' — the release version is not embedded in the shipped files (temperloop#677)"
            exit 1
          fi
          if [ "$reported" != "temperloop $shipped" ]; then
            echo "::error::install-tier2: 'temperloop version' ('$reported') does not match the shipped VERSION file ('$shipped')"
            exit 1
          fi
          echo "OK: the installed CLI reports its embedded version ($shipped)."

      - name: Clone the demo repo (the newcomer's local checkout)
        env:
          GH_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          gh auth setup-git
          git clone "https://github.com/$DEMO_REPO.git" "$RUNNER_TEMP/demo-repo"
          echo "DEMO_DIR=$RUNNER_TEMP/demo-repo" >> "$GITHUB_ENV"

      # --- The real round trip: init -> eject -------------------------------
      #
      # `temperloop init` is deliberately fail-open at the shell-exit-code
      # layer for its interactive/degraded-network use case (a real `gh`
      # failure prints "skipped — <reason>" or "FAILED — <reason>" and still
      # exits 0 — see init.sh's own header). That's the right default for a
      # curious stranger on a flaky connection, and a bare exit code proves
      # nothing for a gate whose whole point is proving the live path ran —
      # so this leg captures its own log and content-scans it instead.
      #
      # Unlike the workflow's own prior revision, this leg does NOT treat
      # every "skipped —" line as fatal: this workflow intentionally never
      # passes --yes-first-epic/--no-first-epic (see the file header's
      # "REUSABLE BASELINE" note), so `init`'s first-epic offer legibly
      # skips on EVERY run by design (the ambient GITHUB_ACTIONS signal) —
      # that is the expected, successful outcome here, not a degrade. A
      # genuine failure is instead caught by a `FAILED` marker, and full
      # completion is proven by the stable `next step:` handoff line
      # (init.sh's own header: "the stable marker
      # .github/workflows/install-tier2.yml greps to prove the live round
      # trip actually reached the handoff" — true regardless of whether the
      # first-epic offer ran).
      - name: "Round trip 1/2 — init (bootstrap + proposal PR + handoff)"
        id: init
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          temperloop init --dir "$DEMO_DIR" --gh-repo "$DEMO_REPO" --timeout 30 \
            2>&1 | tee "$RUNNER_TEMP/init.log"
          if grep -q "FAILED" "$RUNNER_TEMP/init.log"; then
            echo "::error::install-tier2: 'temperloop init' reported a FAILED action — see the init.log artifact:"
            grep "FAILED" "$RUNNER_TEMP/init.log" || true
            exit 1
          fi
          if ! grep -q '^next step: ' "$RUNNER_TEMP/init.log"; then
            echo "::error::install-tier2: 'temperloop init' never printed its handoff ('next step: …') — the run did not reach the end of its contract. See the init.log artifact."
            exit 1
          fi
          echo "init: OK — config bootstrapped, proposal PR opened, handoff printed (first-epic offer deliberately un-requested, see file header):"
          grep '^next step: ' "$RUNNER_TEMP/init.log"

      # The manifest `eject` reverts holds exactly one entry on a healthy run:
      # the `proposal_pr` init.sh just opened (init applies no other API
      # state — see init.sh's own "SCOPE" header note). eject is fail-open at
      # the exit-code layer exactly like init, so a bare exit code proves
      # nothing: content-scan for its own `FAILED` markers, same shape as the
      # leg above. This is the primary mechanism that returns the demo repo
      # to a reusable baseline every run (see the file header's "REUSABLE
      # BASELINE" note) — no repository is ever created or deleted here.
      - name: "Round trip 2/2 — eject (manifest-driven revert)"
        id: eject
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          temperloop eject --dir "$DEMO_DIR" --gh-repo "$DEMO_REPO" --yes \
            2>&1 | tee "$RUNNER_TEMP/eject.log"
          if grep -q "FAILED" "$RUNNER_TEMP/eject.log"; then
            echo "::error::install-tier2: 'temperloop eject' reported a FAILED revert under the shrunken install manifest — see the eject.log artifact:"
            grep "FAILED" "$RUNNER_TEMP/eject.log" || true
            exit 1
          fi
          echo "eject: OK — clean revert, no FAILED markers"

      - name: Upload round-trip logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-tier2-logs
          path: |
            ${{ runner.temp }}/init.log
            ${{ runner.temp }}/eject.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Round-trip verdict
        if: always()
        env:
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          EJECT_OUTCOME: ${{ steps.eject.outcome }}
        run: |
          {
            echo "## install-tier2 round trip"
            echo
            echo "| leg | outcome |"
            echo "|---|---|"
            echo "| version | $VERSION_OUTCOME |"
            echo "| init | $INIT_OUTCOME |"
            echo "| eject | $EJECT_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed_legs=""
          [ "$VERSION_OUTCOME" = "success" ] || failed_legs="$failed_legs version"
          [ "$INIT_OUTCOME" = "success" ] || failed_legs="$failed_legs init"
          [ "$EJECT_OUTCOME" = "success" ] || failed_legs="$failed_legs eject"

          if [ -n "$failed_legs" ]; then
            echo "::error::install-tier2: real round trip FAILED at leg(s):$failed_legs — download the install-tier2-logs artifact and check the named step(s) above for detail."
            {
              echo
              echo "**FAILED leg(s):$failed_legs** — see the install-tier2-logs artifact and the named step logs above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Both legs (init/eject) completed the live round trip successfully." >> "$GITHUB_STEP_SUMMARY"
